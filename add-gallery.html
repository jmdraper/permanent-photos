<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YMS Gallery Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&family=DM+Mono:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0e0e0e;
    --surface: #181818;
    --surface2:#202020;
    --border:  rgba(255,255,255,0.08);
    --text:    #e8e2d9;
    --muted:   rgba(232,226,217,0.45);
    --accent:  #c8a96e;
    --green:   #4caf7d;
    --red:     #e07070;
    --radius:  6px;
  }

  body {
    font-family: 'Almarai', sans-serif;
    background:  var(--bg);
    color:       var(--text);
    min-height:  100vh;
    display:     flex;
    flex-direction: column;
    align-items: center;
    padding:     3rem 1.5rem 4rem;
  }

  /* ── Header ──────────────────────────────────────────────────── */
  .hdr {
    text-align:    center;
    margin-bottom: 2.5rem;
    width:         100%;
    max-width:     560px;
  }
  .hdr-eyebrow {
    font-size:      0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color:          var(--accent);
    margin-bottom:  0.5rem;
  }
  .hdr h1 {
    font-size:      1.5rem;
    font-weight:    700;
    letter-spacing: 0.04em;
  }

  /* ── Card ─────────────────────────────────────────────────────── */
  .card {
    background:    var(--surface);
    border:        1px solid var(--border);
    border-radius: var(--radius);
    padding:       1.75rem;
    width:         100%;
    max-width:     560px;
    margin-bottom: 1.25rem;
  }
  .card-title {
    font-size:      0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color:          var(--muted);
    margin-bottom:  1.25rem;
    padding-bottom: 0.7rem;
    border-bottom:  1px solid var(--border);
  }

  /* ── Form ─────────────────────────────────────────────────────── */
  .field { margin-bottom: 1.1rem; }
  .field:last-child { margin-bottom: 0; }

  label {
    display:        block;
    font-size:      0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color:          var(--muted);
    margin-bottom:  0.35rem;
  }

  input {
    width:         100%;
    background:    rgba(255,255,255,0.04);
    border:        1px solid var(--border);
    border-radius: var(--radius);
    color:         var(--text);
    font-family:   'DM Mono', monospace;
    font-size:     0.73rem;
    padding:       0.6rem 0.8rem;
    outline:       none;
    transition:    border-color 0.15s;
  }
  input:focus          { border-color: var(--accent); }
  input::placeholder   { color: rgba(255,255,255,0.18); }

  .hint {
    font-size:  0.63rem;
    color:      var(--muted);
    margin-top: 0.3rem;
    line-height: 1.5;
  }

  /* ── Buttons ──────────────────────────────────────────────────── */
  .btn {
    width:          100%;
    padding:        0.72rem;
    border:         1px solid transparent;
    border-radius:  var(--radius);
    font-family:    'Almarai', sans-serif;
    font-size:      0.68rem;
    font-weight:    700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor:         pointer;
    transition:     all 0.15s;
  }
  .btn-primary            { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
  .btn-primary:hover      { background: #b8944e; border-color: #b8944e; }
  .btn-primary:disabled   { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost              { background: transparent; border-color: var(--border); color: var(--muted); margin-top: 0.6rem; }
  .btn-ghost:hover        { border-color: var(--accent); color: var(--accent); }
  .btn-danger             { background: transparent; border-color: rgba(224,112,112,0.3); color: var(--red); margin-top: 0.6rem; }
  .btn-danger:hover       { border-color: var(--red); background: rgba(224,112,112,0.08); }

  /* ── Status banner ────────────────────────────────────────────── */
  .status {
    display:       none;
    width:         100%;
    max-width:     560px;
    padding:       0.9rem 1rem;
    border-radius: var(--radius);
    font-size:     0.75rem;
    margin-bottom: 1.25rem;
    border:        1px solid;
    line-height:   1.5;
  }
  .status.ok    { background: rgba(76,175,125,0.1); border-color: rgba(76,175,125,0.3); color: var(--green); display: block; }
  .status.err   { background: rgba(224,112,112,0.1); border-color: rgba(224,112,112,0.3); color: var(--red);   display: block; }
  .status.info  { background: rgba(200,169,110,0.08); border-color: rgba(200,169,110,0.2); color: var(--accent); display: block; }

  /* ── Gallery list ─────────────────────────────────────────────── */
  .gallery-list { list-style: none; }
  .gallery-item {
    display:       flex;
    align-items:   center;
    gap:           0.75rem;
    padding:       0.7rem 0;
    border-bottom: 1px solid var(--border);
  }
  .gallery-item:last-child { border-bottom: none; }
  .gallery-thumb {
    width:         44px;
    height:        44px;
    object-fit:    cover;
    border-radius: 3px;
    background:    var(--surface2);
    flex-shrink:   0;
  }
  .gallery-thumb-placeholder {
    width:         44px;
    height:        44px;
    border-radius: 3px;
    background:    var(--surface2);
    border:        1px solid var(--border);
    flex-shrink:   0;
    display:       flex;
    align-items:   center;
    justify-content: center;
    font-size:     1rem;
    opacity:       0.4;
  }
  .gallery-info { flex: 1; min-width: 0; }
  .gallery-name {
    font-size:     0.78rem;
    font-weight:   700;
    white-space:   nowrap;
    overflow:      hidden;
    text-overflow: ellipsis;
  }
  .gallery-url {
    font-family:   'DM Mono', monospace;
    font-size:     0.6rem;
    color:         var(--muted);
    white-space:   nowrap;
    overflow:      hidden;
    text-overflow: ellipsis;
    margin-top:    0.15rem;
  }
  .gallery-remove {
    background:  none;
    border:      none;
    color:       var(--muted);
    cursor:      pointer;
    font-size:   1rem;
    padding:     0.2rem 0.4rem;
    border-radius: 3px;
    transition:  color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .gallery-remove:hover { color: var(--red); background: rgba(224,112,112,0.1); }

  .empty-note {
    font-size:  0.75rem;
    color:      var(--muted);
    text-align: center;
    padding:    1rem 0;
  }

  /* ── Spinner ──────────────────────────────────────────────────── */
  .spinner {
    display:      inline-block;
    width:        12px;
    height:       12px;
    border:       2px solid rgba(0,0,0,0.3);
    border-top:   2px solid #0e0e0e;
    border-radius:50%;
    animation:    spin 0.7s linear infinite;
    margin-right: 0.4rem;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eyebrow">York Musical Society</div>
  <h1>Gallery Manager</h1>
</div>

<div id="status" class="status"></div>

<!-- Token setup -->
<div class="card" id="token-card">
  <div class="card-title">GitHub Access</div>
  <div class="field">
    <label for="token-input">Personal Access Token</label>
    <input type="password" id="token-input" placeholder="github_pat_…" autocomplete="off">
    <div class="hint">Stored in this browser only. Never sent anywhere except the GitHub API.</div>
  </div>
  <button class="btn btn-primary" onclick="saveToken()">Save Token</button>
  <button class="btn btn-danger" id="clear-token-btn" onclick="clearToken()" style="display:none">Clear Saved Token</button>
</div>

<!-- Add gallery -->
<div class="card">
  <div class="card-title">Add New Gallery</div>
  <div class="field">
    <label for="title">Gallery Title</label>
    <input type="text" id="title" placeholder="e.g. Christmas Concert 2024">
  </div>
  <div class="field">
    <label for="year">Year</label>
    <input type="text" id="year" placeholder="e.g. 2024" maxlength="4">
  </div>
  <div class="field">
    <label for="flickr-url">Flickr Gallery URL</label>
    <input type="url" id="flickr-url" placeholder="https://www.flickr.com/photos/…/galleries/…/">
  </div>
  <div class="field">
    <label for="cover-url">Cover Photo URL</label>
    <input type="url" id="cover-url" placeholder="https://www.flickr.com/photos/allan_harris/…/">
    <div class="hint">Right-click any photo in the gallery → Copy Link, or paste the photo's page URL.</div>
  </div>
  <button class="btn btn-primary" id="add-btn" onclick="addGallery()">Add Gallery</button>
</div>

<!-- Current galleries -->
<div class="card">
  <div class="card-title">Current Galleries</div>
  <ul class="gallery-list" id="gallery-list">
    <li class="empty-note">Loading…</li>
  </ul>
  <button class="btn btn-ghost" onclick="loadGalleries()" style="margin-top:1rem">↻ Refresh</button>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const OWNER  = 'jmdraper';
const REPO   = 'permanent-photos';
const FILE   = 'flickr-galleries-config.json';
const BRANCH = 'main';
const API    = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;

// ── Token management ─────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('yms_gh_token') || ''; }

function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) { showStatus('Please enter a token.', 'err'); return; }
  localStorage.setItem('yms_gh_token', t);
  document.getElementById('token-input').value = '';
  showStatus('Token saved to this browser.', 'ok');
  updateTokenUI();
  loadGalleries();
}

function clearToken() {
  localStorage.removeItem('yms_gh_token');
  showStatus('Token cleared.', 'info');
  updateTokenUI();
}

function updateTokenUI() {
  const has = !!getToken();
  document.getElementById('clear-token-btn').style.display = has ? 'block' : 'none';
  if (has) document.getElementById('token-input').placeholder = '••••••••••••••••••••• (token saved)';
  else      document.getElementById('token-input').placeholder = 'github_pat_…';
}

// ── GitHub API helpers ────────────────────────────────────────────────────────
async function fetchConfig() {
  const res = await fetch(API, {
    headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
  const data = await res.json();
  const content = JSON.parse(atob(data.content.replace(/\n/g, '')));
  return { content, sha: data.sha };
}

async function saveConfig(content, sha) {
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2) + '\n')));
  const res = await fetch(API, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Accept':        'application/vnd.github+json',
      'Content-Type':  'application/json',
    },
    body: JSON.stringify({
      message: `chore: update flickr galleries config`,
      content: encoded,
      sha,
      branch: BRANCH,
    }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || `GitHub API error: ${res.status}`);
  }
  return res.json();
}

// ── Load & render gallery list ────────────────────────────────────────────────
async function loadGalleries() {
  if (!getToken()) {
    document.getElementById('gallery-list').innerHTML =
      '<li class="empty-note">Enter your GitHub token above to get started.</li>';
    return;
  }

  document.getElementById('gallery-list').innerHTML = '<li class="empty-note">Loading…</li>';

  try {
    const { content } = await fetchConfig();
    renderList(content);
  } catch (err) {
    document.getElementById('gallery-list').innerHTML =
      `<li class="empty-note" style="color:var(--red)">${esc(err.message)}</li>`;
  }
}

function renderList(galleries) {
  const list = document.getElementById('gallery-list');
  if (!galleries.length) {
    list.innerHTML = '<li class="empty-note">No galleries yet — add one above.</li>';
    return;
  }
  list.innerHTML = '';
  galleries.forEach((g, i) => {
    const li = document.createElement('li');
    li.className = 'gallery-item';
    const thumb = g.coverPhotoUrl
      ? '' // we don't have the resolved image URL here, just show placeholder
      : '';
    li.innerHTML =
      '<div class="gallery-thumb-placeholder">🖼</div>' +
      '<div class="gallery-info">' +
        '<div class="gallery-name">' + esc(g.title) + '</div>' +
        '<div class="gallery-url">' + esc(g.flickrUrl) + '</div>' +
      '</div>' +
      '<button class="gallery-remove" onclick="removeGallery(' + i + ')" title="Remove">✕</button>';
    list.appendChild(li);
  });
}

// ── Add gallery ───────────────────────────────────────────────────────────────
async function addGallery() {
  const title      = document.getElementById('title').value.trim();
  const year       = document.getElementById('year').value.trim();
  const flickrUrl  = document.getElementById('flickr-url').value.trim();
  const coverUrl   = document.getElementById('cover-url').value.trim();

  if (!title)     { showStatus('Please enter a gallery title.', 'err'); return; }
  if (!year)      { showStatus('Please enter a year.', 'err'); return; }
  if (!flickrUrl) { showStatus('Please enter the Flickr gallery URL.', 'err'); return; }
  if (!coverUrl)  { showStatus('Please enter a cover photo URL.', 'err'); return; }
  if (!getToken()) { showStatus('Please save your GitHub token first.', 'err'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';
  showStatus('Saving…', 'info');

  try {
    const { content, sha } = await fetchConfig();

    // Check for duplicate
    if (content.find(g => g.flickrUrl === flickrUrl)) {
      showStatus('A gallery with that URL already exists.', 'err');
      btn.disabled = false;
      btn.textContent = 'Add Gallery';
      return;
    }

    content.push({ title, year, flickrUrl, coverPhotoUrl: coverUrl });
    await saveConfig(content, sha);

    showStatus(`✓ "${title}" added. The nightly workflow will update the widget, or trigger a manual run now.`, 'ok');
    document.getElementById('title').value     = '';
    document.getElementById('year').value      = '';
    document.getElementById('flickr-url').value = '';
    document.getElementById('cover-url').value  = '';
    renderList(content);
  } catch (err) {
    showStatus('Error: ' + err.message, 'err');
  }

  btn.disabled = false;
  btn.textContent = 'Add Gallery';
}

// ── Remove gallery ────────────────────────────────────────────────────────────
async function removeGallery(index) {
  if (!confirm('Remove this gallery from the config?')) return;

  showStatus('Removing…', 'info');
  try {
    const { content, sha } = await fetchConfig();
    const removed = content.splice(index, 1)[0];
    await saveConfig(content, sha);
    showStatus(`✓ "${removed.title}" removed.`, 'ok');
    renderList(content);
  } catch (err) {
    showStatus('Error: ' + err.message, 'err');
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateTokenUI();
loadGalleries();
</script>
</body>
</html>
