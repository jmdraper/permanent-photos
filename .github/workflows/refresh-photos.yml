name: Refresh Photos Manifest

on:
  # Run every day at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'
  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install @permanentorg/sdk

      - name: Run manifest script
        id: manifest
        env:
          PERMANENT_TOKEN:     ${{ secrets.PERMANENT_TOKEN }}
          PERMANENT_FOLDER_ID: ${{ secrets.PERMANENT_FOLDER_ID }}
        run: |
          node generate-manifest.mjs
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE
        continue-on-error: true

      - name: Generate Flickr galleries manifest
        id: flickr
        run: |
          node generate-flickr-galleries.mjs
        continue-on-error: true

      # ── Token expired (exit code 2) ───────────────────────────────────
      - name: Notify home automation — token expired
        if: steps.manifest.outcome == 'failure' && steps.manifest.outputs.exit_code == '2'
        run: |
          echo "Token expired — calling webhook..."
          curl -fsS --max-time 10 "https://webhook.homey.app/677c09939dac128f0fab76ae/photos_widget_token?tag=token_expired" \
            || echo "Webhook call failed (continuing)"

      # ── Other failure ─────────────────────────────────────────────────
      - name: Notify home automation — script error
        if: steps.manifest.outcome == 'failure' && steps.manifest.outputs.exit_code != '2'
        run: |
          echo "Script error — calling webhook..."
          curl -fsS --max-time 10 "https://webhook.homey.app/677c09939dac128f0fab76ae/photos_widget_token?tag=script_error" \
            || echo "Webhook call failed (continuing)"

      - name: Fail job on non-auth error
        if: steps.manifest.outcome == 'failure' && steps.manifest.outputs.exit_code != '2'
        run: exit 1

      # ── Success: commit updated manifests ────────────────────────────
      - name: Commit and push updated manifests
        if: steps.manifest.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos.json flickr-galleries.json
          # Only commit if files actually changed
          git diff --cached --quiet || git commit -m "chore: refresh manifests [$(date -u '+%Y-%m-%d')]"
          git push
